name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches VERSION
        run: |
          version="$(cat VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests

      - name: Build the release archive
        run: |
          archive="TheFrameVanced-$GITHUB_REF_NAME.tar.gz"
          git archive --format=tar.gz --prefix="TheFrameVanced-$GITHUB_REF_NAME/" -o "$archive" "$GITHUB_REF_NAME"
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "TheFrameVanced-$GITHUB_REF_NAME.tar.gz" \
            "TheFrameVanced-$GITHUB_REF_NAME.tar.gz.sha256" \
            --verify-tag --generate-notes
